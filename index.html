<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invito al Matrimonio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
      <h1 id="welcome-text"></h1>
      <div class="lang-switch">
        <button data-lang="it">🇮🇹 Italiano</button>
        <button data-lang="en">🇬🇧 English</button>
        <button data-lang="fr">🇫🇷 Français</button>
        <button data-lang="es">🇪🇸 Español</button>
        <button data-lang="fi">🇫🇮 Suomi</button>
      </div>
    </header>

  <main>
    <!-- === NEW EXPLANATION SECTION === -->
    <section id="explanation-section">
      <p id="explanation-text"></p>
    </section>
    <!-- === END NEW SECTION === -->

    <nav id="menu">
      <!-- dynamic menu items -->
    </nav>
    <section id="info">
      <!-- Menu content will be dynamically inserted here -->
    </section>
  </main>

  <footer>
    <p id="token-text"></p>
    <p class="whatsapp-contact"> <!-- Added a class for potential styling -->
       <!-- Text before the link -->
      <span id="whatsapp-intro-text"></span> <!-- Placeholder for text like "Contact:" -->
      <!-- The actual link -->
      <a id="whatsapp-link" href="#" target="_blank" class="whatsapp-link-container">
        <img src="images/whatsapp-icon.svg" alt="WhatsApp" class="whatsapp-icon">
        <span id="whatsapp-link-text"></span> <!-- Placeholder for "Send photos..." -->
      </a>
    </p>
    <!-- Optional: Seashell image -->
    <!-- <img src="images/seashell.png" alt="" class="seashell-decoration"> -->
  </footer>

  <script src="script.js"></script>
</body>
</html>
