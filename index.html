<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invito al Matrimonio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@700&family=Merriweather:ital,wght@0,400;0,700;1,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>

    <header>
      <h1 id="welcome-text"></h1>
      <div class="lang-switch">
        <button data-lang="it">🇮🇹 Italiano</button>
        <button data-lang="en">🇬🇧 English</button>
        <button data-lang="fr">🇫🇷 Français</button>
        <button data-lang="es">🇪🇸 Español</button>
        <button data-lang="fi">🇫🇮 Suomi</button>
      </div>
    </header>

  <main>
    <!-- === NEW EXPLANATION SECTION === -->
    <section id="explanation-section">
      <p id="explanation-text"></p>
    </section>
    <!-- === END NEW SECTION === -->

    <!-- === NEW IMAGE SLIDESHOW === -->
    <div id="image-slideshow">
      <img src="images/photo1.jpeg" alt="Couple photo 1" class="slide-image active">
      <img src="images/photo2.jpeg" alt="Wedding detail photo" class="slide-image">
      <img src="images/photo3.jpeg" alt="Couple photo 2" class="slide-image">
      <img src="images/photo4.jpeg" alt="Venue photo" class="slide-image">
      <img src="images/photo5.jpeg" alt="Venue photo" class="slide-image">
      <img src="images/photo6.jpeg" alt="Venue photo" class="slide-image">
      <!-- Add more images as needed -->
    </div>
    <!-- === END IMAGE SLIDESHOW === -->

    <!-- NOTE: If you still have the <nav id="menu"> here, the slideshow
               should go between #explanation-section and #menu -->
    <nav id="menu">
      <!-- dynamic menu items -->
    </nav>
    <section id="info">
      <!-- Menu content will be dynamically inserted here -->
    </section>
  </main>

<footer>
    <!-- <p id="token-text"></p> --> <!-- REMOVED -->
    <!-- <p class="whatsapp-contact"> ... </p> --> <!-- ENTIRE PARAGRAPH REMOVED -->

    <!-- You might want a generic closing message or copyright here -->
    <p> Bon appétit !</p>
    <!-- Optional: Seashell image -->
    <!-- <img src="images/seashell.png" alt="" class="seashell-decoration"> -->
  </footer>

  <script src="script.js"></script>
</body>
</html>
