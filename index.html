<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Invito al Matrimonio</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header>
    <h1 id="welcome-text"></h1>
    <div class="lang-switch">
      <button data-lang="it">🇮🇹 Italiano</button>
      <button data-lang="en">🇬🇧 English</button>
      <button data-lang="fr">🇫🇷 Français</button>
    </div>
  </header>

  <main>
    <nav id="menu">
      <!-- dynamic menu items -->
    </nav>
    <section id="info">
      <h2 id="details-header">Details</h2>
      <p id="details-content">
          We are so excited to share our special day with you!
          More information about the schedule, location, and registry will be added soon.
          <br><br>
          Date: [Wedding Date] <br>
          Time: [Wedding Time] <br>
          Location: [Wedding Venue Name & Address]
      </p>
       <!-- Add more sections as needed -->
      <!--
      Example:
      <h2 id="schedule-header">Schedule</h2>
      <p id="schedule-content">Ceremony: [Time], Reception: [Time]</p>
      -->
    </section>
  </main>

  <footer>
    <p id="token-text"></p>
    <p>Contatta via WhatsApp: 
      <a id="whatsapp-link" href="#" target="_blank">✉️ WhatsApp</a>
    </p>
    <img id="qr-code" alt="QR Code">
  </footer>

  <script src="script.js"></script>
</body>
</html>
